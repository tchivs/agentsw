name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # no dependency cache in a release build: the published artifact must come from
      # the registry, not from a cache another workflow could have poisoned
      # trusted publishing requires npm >= 11.5.1 (node 22 bundles npm 10)
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package.json $PKG_VERSION" >&2
            exit 1
          fi
      # No token: authenticated via OIDC trusted publisher (configure on npmjs.com:
      # package Settings -> Trusted Publisher -> GitHub Actions, repo tchivs/agentsw,
      # workflow release.yml). Provenance is generated automatically.
      - run: npm publish --access public
      # The changelog entry is the release note; the auto-generated commit list is
      # appended below it. Without this the body is just a compare link.
      - name: Slice the changelog entry for this tag
        run: |
          awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" tag "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "No changelog entry for $GITHUB_REF_NAME." > RELEASE_NOTES.md
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
