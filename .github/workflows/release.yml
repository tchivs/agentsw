name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # trusted publishing requires npm >= 11.5.1 (node 22 bundles npm 10)
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package.json $PKG_VERSION" >&2
            exit 1
          fi
      # No token: authenticated via OIDC trusted publisher (configure on npmjs.com:
      # package Settings -> Trusted Publisher -> GitHub Actions, repo tchivs/smart-switch,
      # workflow release.yml). Provenance is generated automatically.
      - run: npm publish --access public
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
